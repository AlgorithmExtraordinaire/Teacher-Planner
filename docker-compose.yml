name: teacher-planner

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: teacher-planner-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:3000"
    env_file:
      - .env
